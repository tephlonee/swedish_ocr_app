version: '3.8'
services:
  ocr_app:
    build: ./api
    image: ocr_app:latest
    container_name: ocr_app
    ports:
      - "5000:5000"
    expose:
      - "5000"
    volumes:
      - ./api:/app/api
    command: uvicorn api.app:app --host 0.0.0.0 --port 5000 --reload
    env_file:
      - .env

  celery_worker:
    image: ocr_app:latest
    command: watchmedo auto-restart --recursive -- celery -A celery.celery worker --loglevel=info --logfile=logs/celery.log
    volumes:
      - ./api:/app
    env_file:
      - .env
    depends_on:
      - redis

  react-app:
    build: ./web
    container_name: react_app
    ports:
      - "3000:80"
    volumes:
      - ./web:/app
    depends_on:
      - ocr_app
    env_file:
      - .env

  redis:
    image: redis:7
